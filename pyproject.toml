[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-sre-agent"
version = "0.1.0"
description = "Linux SRE monitoring agent backed by Ollama and Telegram"
requires-python = ">=3.10"
dependencies = [
    "docker",
    "psutil",
    "requests",
]

[project.scripts]
sre-agent = "sre_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
